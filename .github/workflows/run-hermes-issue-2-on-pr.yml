name: Apply Hermes issue 2 on PR open

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'hermes/issue-2-kansai-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hermes/issue-2-kansai-audit
          fetch-depth: 0
      - name: Apply Hermes audit patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def r(path, old, new, n=1):
              p=Path(path); s=p.read_text(encoding='utf-8'); c=s.count(old)
              if c != n: raise SystemExit(f'{path}: expected {n}, found {c}: {old[:70]}')
              p.write_text(s.replace(old,new), encoding='utf-8')
          r('culture.html','https://www.kohfukuji.com/about/history/','https://www.kohfukuji.com/',2)
          r('culture.html','https://www.city.kobe.lg.jp/information/institution/institution/document/archive/detail/history_01.html','https://www.city.kobe.lg.jp/e90232/kuyakusho/hyogoku/shoukai/rekishi/history_3.html')
          r('daily.html','<li>依水園16:00前必須入場。</li>','<li>依水園官方最終入園16:00（開園至16:30）。南都仏画若當日排隊長，優先保住特展核心後再入佛像館，12:30準時離館。</li>')
          r('data/itinerary.json','"last_verified": "2026-07-23"','"last_verified": "2026-08-11"')
          r('museums.html','<p class="source-links"><a href="https://www.narahaku.go.jp/exhibition/special/special_exhibition/202607_nantobutsuga/" target="_blank" rel="noopener">南都仏画官方展頁 ↗</a> · <a href="https://www.narahaku.go.jp/exhibition/" target="_blank" rel="noopener">展覽總覽 ↗</a></p>','<div class="notice sage">運營備註（2026-08-11核實）：特別展「南都仏画」官方開館時間為9:30–17:00（最終入場閉館前30分）；星期六延長至19:00。官方曾於8/11–8/16視混雜發放入場整理券；27/8已過該公告期，惟展期至9/13，出發前一晚仍應查看<a href="https://www.narahaku.go.jp/news/" target="_blank" rel="noopener">館方最新公告</a>及<a href="https://x.com/nantobutsuga26" target="_blank" rel="noopener">展會官方X</a>。佛像館將於9/14起長期休館改修，27/8仍屬開放期。</div>\n        <p class="source-links"><a href="https://www.narahaku.go.jp/exhibition/special/202607_nantobutsuga/" target="_blank" rel="noopener">南都仏画官方展頁 ↗</a> · <a href="https://www.narahaku.go.jp/exhibition/" target="_blank" rel="noopener">展覽總覽 ↗</a></p>')
          r('museums.html','<div class="decision-grid"><div><strong>路線</strong><span>博物館 → 南大門 → 大佛殿 → 法華堂；二月堂只作餘裕項</span></div><div><strong>硬離開</strong><span>15:30，保住依水園16:00最後入園</span></div><div><strong>延伸</strong><span><a href="daily.html#d0827">27/8行程</a> · <a href="culture.html#nara">佛教制度</a> · <a href="maps.html#d0827">步行地圖</a></span></div></div>','<div class="decision-grid"><div><strong>路線</strong><span>博物館 → 南大門 → 大佛殿 → 法華堂；二月堂只作餘裕項</span></div><div><strong>硬離開</strong><span>15:30，保住依水園16:00最後入園；法華堂4–10月官方至16:00</span></div><div><strong>延伸</strong><span><a href="daily.html#d0827">27/8行程</a> · <a href="culture.html#nara">佛教制度</a> · <a href="maps.html#d0827">步行地圖</a></span></div></div>')
          r('museums.html','<div class="decision-grid"><div><strong>觀看問題</strong><span>哪一段景色由人工安排，哪一層借自園外？</span></div><div><strong>硬時間</strong><span>16:00前入園；16:45離開</span></div><div><strong>相關頁面</strong><span><a href="daily.html#d0827">27/8行程</a> · <a href="culture.html#nara">奈良文化線</a> · <a href="maps.html#d0827">步行地圖</a> · <a href="https://isuien.or.jp/" target="_blank" rel="noopener">官方資料 ↗</a></span></div></div>','<div class="decision-grid"><div><strong>觀看問題</strong><span>哪一段景色由人工安排，哪一層借自園外？</span></div><div><strong>硬時間</strong><span>官方開園9:30–16:30，最終入園16:00；16:45離園。每火曜休（祝日開園則翌平日休）</span></div><div><strong>相關頁面</strong><span><a href="daily.html#d0827">27/8行程</a> · <a href="culture.html#nara">奈良文化線</a> · <a href="maps.html#d0827">步行地圖</a> · <a href="https://isuien.or.jp/access" target="_blank" rel="noopener">官方利用案内 ↗</a></span></div></div>')
          r('museums.html','<div id="hakutsuru-detail"><div class="meta">15:25–16:05</div><h3>白鶴：補回完整流程</h3><p>資料館利用舊酒藏、人形與工具重現蒸米、製麴、酒母、醪、上槽等工序。看米在每一步如何改變，再記住温度、時間與人手判斷介入的位置。</p><p><strong>看點：</strong>大型木桶、甑、麴室、壓榨工具與工人分工。這站追求全貌，試飲從簡。</p><a href="https://www.hakutsuru.co.jp/community/shiryo/" target="_blank" rel="noopener">官方資料 ↗</a></div>','<div id="hakutsuru-detail"><div class="meta">15:25–16:05</div><h3>白鶴：補回完整流程</h3><p>資料館利用舊酒藏、人形與工具重現蒸米、製麴、酒母、醪、上槽等工序。看米在每一步如何改變，再記住温度、時間與人手判斷介入的位置。</p><p><strong>看點：</strong>大型木桶、甑、麴室、壓榨工具與工人分工。這站追求全貌，試飲從簡。</p><div class="notice sage">運營備註（2026-08-11核實）：官方開館9:30–16:30（最終入館16:00）。2026年因館內改修，お盆休延長至8/5–8/18；30/8已在復館後，惟本社敷地有新釀造藏工程，出發前再確認<a href="https://www.hakutsuru.co.jp/community/shiryo/" target="_blank" rel="noopener">官方休館公告</a>。</div><a href="https://www.hakutsuru.co.jp/community/shiryo/" target="_blank" rel="noopener">官方資料 ↗</a></div>')
          r('offline-files.json','"version": "2026-07-28"','"version": "2026-08-11"')
          PY
          python3 scripts/validate_site.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add culture.html daily.html data/itinerary.json museums.html offline-files.json
          git commit -m "Apply Hermes issue #2 audit fixes [hermes-applied]"
          git push origin HEAD:hermes/issue-2-kansai-audit

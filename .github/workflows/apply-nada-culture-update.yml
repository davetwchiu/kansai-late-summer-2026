name: Apply Nada culture update

on:
  push:
    paths:
      - .github/workflows/apply-nada-culture-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Nada culture section
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("culture.html")
          text = path.read_text(encoding="utf-8")

          new_section = r'''<section class="section alt" id="nada"><div class="wrap"><article class="essay culture-depth">
          <div class="kicker">Nada Gogō / early industrial ecosystem</div>
          <h2>灘酒：風土如何被組織成一套近世工業系統</h2>
          <p class="pullquote"><a class="term-link" href="https://www.nadagogo.ne.jp/heritage/" target="_blank" rel="noopener noreferrer" title="灘五鄉酒造組合：灘五鄉日本遺產與酒造歷史">灘五鄉</a>的力量，來自一整套彼此咬合的生產制度。水、米、冬季氣候與六甲山急流提供條件；杜氏與藏人把條件轉成可重複的技術；酒造家投入土地、酒藏、工具、燃料與週轉資本；酒樽、港口、樽廻船和江戶市場再把產品送往遠方。</p>

          <h3>一、五鄉是一條沿海生產帶</h3>
          <p>今日的<a class="term-link" href="https://www.nadagogo.ne.jp/history/" target="_blank" rel="noopener noreferrer" title="灘五鄉酒造組合：五鄉形成與歷史">灘五鄉</a>由東至西大致分為今津鄉、西宮鄉、魚崎鄉、御影鄉與西鄉，橫跨西宮市和神戶市沿岸。這個名稱經過多次地域重組；1828年，上灘再分成東、中、西三組，與下灘、今津合成當時的五鄉，其範圍後來再演變成今日分類。</p>
          <p>這次行程由魚崎進入，再向西走入御影鄉。菊正宗、白鶴和福壽都集中於其中一段，實際看到的是整條灘五鄉生產帶中最密集的一區。沿途的河川、國道、阪神電車、住宅、工廠與大型酒造同時存在，顯示這裡至今仍是一個生產中的都市區域。</p>

          <h3>二、江戶市場推動規模、穩定與信用</h3>
          <p>十八世紀以後，灘逐步超越較早成名的池田和伊丹，成為江戶重要的清酒供應地。酒從上方向東運送，因而被稱為<a class="term-link" href="https://www.nadagogo.ne.jp/kudarizake/" target="_blank" rel="noopener noreferrer" title="灘五鄉酒造組合：下り酒的歷史">「下り酒」</a>。江戶人口龐大，消費量高，酒造家需要年復一年供應大量而品質穩定的產品。生產規模、品質判斷、包裝、運輸和商業信用遂成為同一套市場制度。</p>
          <p><a class="term-link" href="https://www.nadagogo.ne.jp/heritage/" target="_blank" rel="noopener noreferrer" title="灘五鄉酒造組合：樽廻船與江戶運輸">樽廻船</a>把酒樽集中運往江戶，降低運輸時間和成本。樽本身亦參與酒質：以吉野杉側板和竹箍製成的酒樽，會在運送期間賦予酒液杉木香氣。灘酒因此連接六甲山麓、奈良吉野林業、沿海船運、江戶批發市場和城市飲食文化。</p>

          <h3>三、自然條件要經過技術，才會成為優勢</h3>
          <p>六甲山急流可以推動<a class="term-link" href="https://www.nadagogo.ne.jp/climate/" target="_blank" rel="noopener noreferrer" title="灘五鄉酒造組合：水車精米、宮水與寒造">水車精米</a>。水車比人力踏碓處理得更多，亦能提高精白程度，令酒造家擴大產量並更細緻地控制米粒外層成分。這項能源和機械優勢，是灘酒規模化的重要條件。</p>
          <p>西宮一帶的<a class="term-link" href="https://www.nadagogo.ne.jp/climate/" target="_blank" rel="noopener noreferrer" title="灘五鄉酒造組合：宮水的水質與釀造作用">宮水</a>含有適合酵母繁殖和醪發酵的礦物成分。冬季寒冷與六甲颪則有助低溫發酵和衛生管理，形成灘酒著名的<a class="term-link" href="https://www.nadagogo.ne.jp/climate/" target="_blank" rel="noopener noreferrer" title="灘五鄉酒造組合：寒造與六甲山氣候">寒造</a>環境。</p>
          <p>這些自然條件仍須由洗米、浸漬、蒸米、製麴、酒母、三段仕込み、醪和上槽等工序逐步接住。水質、氣候和地形提供可能，酒藏設備與人的判斷決定最終酒質。</p>
          <p>上午在<a class="term-link" href="https://www.dougukan.jp/" target="_blank" rel="noopener noreferrer" title="竹中大工道具館官方網站">竹中大工道具館</a>所見的技術邏輯，到下午仍然適用。木工按木紋、含水率、聲音和阻力調整工具；藏人則按米的吸水、蒸米手感、麴的氣味、醪溫度和發酵速度調整操作。兩者都透過長期感官訓練，把天然材料的變化控制在可接受範圍內。</p>

          <h3>四、丹波杜氏把季節勞動組織成技術制度</h3>
          <p>灘酒造長期依靠由丹波等地在農閒期赴灘工作的<a class="term-link" href="https://www.nadagogo.ne.jp/climate/" target="_blank" rel="noopener noreferrer" title="灘五鄉酒造組合：丹波杜氏與藏人制度">丹波杜氏與藏人</a>。杜氏統籌整體酒質和生產節奏，藏人按職責處理釜場、麴室、酒母、醪、上槽、桶具和出貨。這種季節性流動令酒造家可以在寒造期間迅速集結大量熟練勞動力。</p>
          <p>技術透過師徒、同鄉網絡、職位分工和每年重複的寒造傳承。<a class="term-link" href="https://www.nadagogo.ne.jp/heritage/" target="_blank" rel="noopener noreferrer" title="灘五鄉酒造組合：酒造唄與藏人勞動">酒造唄</a>亦具有實際作用：洗桶、酛摺、櫂入等工作各有節奏，歌聲幫助多人同步出力、計算時間，也維持封閉酒藏內的工作秩序。</p>
          <p>杜氏傳統因此包含管理制度、勞動紀律和群體記憶。菊正宗展示的大量酒造用具，應連同使用它們的人、職位和工作節奏一併理解。</p>

          <h3>五、酒藏建築與器具本身就是生產技術</h3>
          <p>傳統灘酒藏常由前蔵與大蔵組成<a class="term-link" href="https://www.nadagogo.ne.jp/heritage/" target="_blank" rel="noopener noreferrer" title="灘五鄉酒造組合：重ね蔵與傳統酒藏建築">「重ね蔵」</a>，利用建築方向、厚牆、通風和六甲山冬季風調節內部環境。大型甑、木桶、半切桶、櫂、暖氣樽和壓榨工具，則把人的力量放大並分配到各道工序。</p>
          <p>這些工具各自對應特定容積、重量、溫度、發酵階段和多人協作方式。<a class="term-link" href="https://www.kikumasamune.co.jp/kinenkan/about.html" target="_blank" rel="noopener noreferrer" title="菊正宗酒造記念館：灘酒造用具與館舍介紹">菊正宗酒造記念館</a>所藏的「灘の酒造用具」涵蓋精米、釀造、出貨、銷售、藏人生活和信仰儀式，讓人看到一座酒藏其實是一個完整的工作世界。</p>
          <p><a class="term-link" href="https://www.hakutsuru.co.jp/community/shiryo/about/" target="_blank" rel="noopener noreferrer" title="白鶴酒造資料館：舊酒藏與展示工序">白鶴酒造資料館</a>保存一座大正初期建成、一直使用至1969年的實際酒藏。館內的樓層、工具和等身人形依照工序排列，最適合觀察米和人如何在建築內移動，以及每道工序為何需要特定空間。</p>

          <h3>六、阪神大地震改變了「傳統酒藏」的含義</h3>
          <p><a class="term-link" href="https://www.dri.ne.jp/" target="_blank" rel="noopener noreferrer" title="人與防災未來中心：阪神・淡路大震災資料">1995年阪神・淡路大震災</a>重創灘五鄉，大量木造酒藏倒塌。今日所見的傳統景觀，包含原建築、移築、重建、回收古材、復原工具和企業重新整理的歷史記憶。建築的新舊程度各異，工序、器具、品牌和地域生產仍保持連續。</p>
          <p>菊正宗舊酒造記念館原是一座1659年酒藏，1960年移築後開放。震災時建築倒塌，館方從瓦礫中救出大部分酒造用具，1999年以耐震建築重開，並重新使用舊館的柱梁。館內同時保存<a class="term-link" href="https://www.kikumasamune.co.jp/kinenkan/about.html" target="_blank" rel="noopener noreferrer" title="菊正宗酒造記念館：生酛、灘本流與震災重建">生酛技術、民俗工具和震災重建史</a>。</p>
          <p>福壽原有的江戶時代木造藏亦在震災中全毀。企業於1997年建成<a class="term-link" href="https://www.shushinkan.co.jp/" target="_blank" rel="noopener noreferrer" title="神戶酒心館／福壽官方網站">神戶酒心館</a>，把現役醸造蔵、商店、餐飲、展覽和活動空間整合成一個公共酒藏設施。福壽因此適合觀察酒造如何在災後重新安排傳統、公共開放和現代生產。</p>

          <h3>七、三館應讀成一條連續證據鏈</h3>
          <p>第一站<a class="term-link" href="museums.html#kiku" title="菊正宗入館筆記">菊正宗</a>，先看器具、藏人制度、生酛和震災後重建。核心問題是：誰使用這些工具，工具又如何組織多人勞動？</p>
          <p>第二站<a class="term-link" href="museums.html#hakutsuru-detail" title="白鶴入館筆記">白鶴</a>，沿展覽動線補全洗米、蒸米、製麴、酒母、醪和上槽。核心問題是：原料如何在一座實際酒藏內逐步轉變？</p>
          <p>第三站<a class="term-link" href="museums.html#fukuju" title="福壽日語有料藏見學入館筆記">福壽</a>，進入現役仕込み蔵，把前兩館的傳統流程與今日設備相比。核心問題是：現代酒造如何運用機械、數據、衛生管理和新建築，延續相同的生物控制工作？</p>
          <p>三站合讀後，灘酒會呈現三種時間：菊正宗保存工具、勞動制度和災後救援；白鶴保存傳統工序的建築空間；福壽展示現役生產和震後企業重組。<a class="term-link" href="museums.html#hakutsuru" title="灘酒三館入館筆記">入館筆記</a>負責各站的觀看次序和時間分配；<a class="term-link" href="museums.html#sake-japanese" title="常用酒造日語">酒造日語</a>協助理解現場解說；本文化筆記則交代這些實物背後的地理、經濟、技術和社會制度。</p>

          <div class="interpret-box"><strong>當日觀看線：</strong>由魚崎向御影移動時，留意酒藏與河道、住宅、道路、鐵路和臨海工業的距離。進館後依次追蹤「工具與勞動—原料與工序—現役生產與重建」。灘五鄉至今仍是生產區，資料館、商店和見學路線只是這個工業生態向公眾開放的窗口。</div>
          <div class="contextual-links"><a href="daily.html#d0830">返回30/8行程</a><a href="deep-itinerary.html#kobe">30/8深度行程</a><a href="museums.html#hakutsuru">灘酒三館入館筆記</a><a href="museums.html#sake-japanese">酒造日語</a><a href="food.html#nichigetsu">日月午餐</a><a href="maps.html#d0830">當日地圖</a></div>
          </article></div></section>

          '''

          pattern = re.compile(
              r'<section class="section alt" id="nada">.*?(?=<section class="section" id="osaka">)',
              re.S,
          )
          updated, count = pattern.subn(new_section, text)
          if count != 1:
              raise SystemExit(f"Expected one Nada section, replaced {count}")

          required = [
              'href="museums.html#kiku"',
              'href="museums.html#hakutsuru-detail"',
              'href="museums.html#fukuju"',
              'href="museums.html#sake-japanese"',
              '>菊正宗</a>',
              '>白鶴</a>',
              '>福壽</a>',
              'class="term-link"',
              '1995年阪神・淡路大震災',
          ]
          missing = [item for item in required if item not in updated]
          if missing:
              raise SystemExit(f"Missing required content: {missing}")

          if not updated.index('>菊正宗</a>') < updated.index('>白鶴</a>') < updated.index('>福壽</a>'):
              raise SystemExit("Brewery order is incorrect")

          path.write_text(updated, encoding="utf-8")

      - name: Commit webpage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add culture.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Strengthen Nada sake culture notes"
          git push
